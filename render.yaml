services:
  - type: web
    name: holmstone-utility-management-platform
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    # Persistent disk added 2026-09-28 (via the Render dashboard, not the Blueprint sync - the disk
    # itself was created through Disks -> Add Disk with mount path /var/data before this file was
    # updated to match, and Render doesn't allow changing a disk's mount path after creation, only
    # its size). This block documents what's actually live so a future Blueprint sync doesn't
    # disagree with the dashboard. DATA_DIR below is what actually makes the app use this disk -
    # db.js defaults to ./data (ephemeral, relative to the app's own folder) unless DATA_DIR is set,
    # so mounting the disk alone does nothing without it.
    disk:
      name: holmstone-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATA_DIR
        value: /var/data
